<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1729a1">
<meta name="description" content="سعيد باوزير — روابط الجملة والتجزئة والتواصل الاجتماعي وموقع المحل.">
<title>سعيد باوزير | جميع روابطنا</title>
<style>
:root{color-scheme:dark;--blue:#17299d;--blue2:#09145e;--white:#fff;--muted:#dce3ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;color:var(--white);background:radial-gradient(ellipse at 50% 0%,#354df0 0,#17299d 36%,#07134e 100%);display:flex;justify-content:center;padding:26px 16px 32px}
main{width:min(100%,520px);text-align:center}
.brand{padding:14px 8px 18px}
.logo{width:112px;height:112px;margin:0 auto 12px;border-radius:32px;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#dce5ff);color:#17299d;box-shadow:0 12px 35px #0004}
.logo svg{width:82px;height:82px}
h1{font-size:clamp(2rem,8vw,3rem);margin:8px 0;font-weight:900;letter-spacing:-1px}
.ar-sub{font-size:clamp(1rem,4vw,1.25rem);font-weight:700;margin:0 auto 9px}
.en-sub{font-size:.78rem;line-height:1.6;letter-spacing:.3px;color:var(--muted);margin:0 auto;max-width:430px}
.rule{height:1px;background:#ffffff55;margin:22px 0}
.intro{font-size:1.15rem;font-weight:800;margin:22px 0}
.links{display:grid;gap:12px}
a.link{display:flex;align-items:center;gap:15px;min-height:70px;padding:15px 18px;text-decoration:none;color:#fff;text-align:right;border:1px solid #b9c7ff;border-radius:19px;background:linear-gradient(110deg,#ffffff12,#ffffff06);box-shadow:0 5px 18px #0002;transition:transform .15s,border-color .15s,background .15s}
a.link:hover,a.link:focus-visible{transform:translateY(-2px);border-color:#fff;background:#ffffff18;outline:none}
.icon{width:37px;height:37px;flex:0 0 37px;display:grid;place-items:center;color:#fff}
.icon svg{width:31px;height:31px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.label{font-size:1.08rem;font-weight:800;flex:1}
.arrow{font-size:1.4rem;color:#dce3ff}
.social-title{font-size:.95rem;font-weight:700;color:var(--muted);margin:22px 0 12px}
.socials{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.social{padding:13px 8px;border-radius:15px;border:1px solid #ffffff65;background:#ffffff10;color:#fff;text-decoration:none;font-weight:700}
.social span{display:block;font-size:1.4rem;margin-bottom:6px}
.footer{font-size:.8rem;color:#dce3ff;margin:28px 0 4px}
.footer-mark{width:54px;height:3px;background:#8ea2ff;margin:0 auto 14px;border-radius:9px}
@media(min-width:420px){a.link{min-height:76px}.label{font-size:1.16rem}}
</style>
</head>
<body>
<main>
  <header class="brand">
    <div class="logo" aria-label="شعار سعيد باوزير">
      <svg viewBox="0 0 100 100" role="img" aria-hidden="true">
        <path d="M51 23C57 8 73 8 82 5C80 21 70 33 54 35" fill="#17299d"/>
        <path d="M48 29C43 17 36 12 29 9" stroke="#17299d" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M50 31C42 42 37 48 31 52" stroke="#17299d" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M50 31C58 43 63 49 69 52" stroke="#17299d" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M50 35C28 18 7 37 8 58C8 78 23 94 42 91C48 90 52 87 58 90C78 98 93 78 92 57C91 36 71 19 50 35Z" fill="#17299d"/>
        <text x="50" y="75" font-size="39" font-weight="900" font-family="Arial,sans-serif" text-anchor="middle" fill="#fff">SB</text>
      </svg>
    </div>
    <h1>سعيد باوزير</h1>
    <p class="ar-sub">لجملة الصيدليات والعناية والتجميل</p>
    <p class="en-sub">FOR WHOLESALE PHARMACIES, CARE, AND COSMETICS</p>
  </header>
  <div class="rule"></div>
  <p class="intro">جميع روابطنا في مكان واحد</p>
  <section class="links" aria-label="روابط الشركة">
    <a class="link" href="https://saeedbawazir.com/" target="_blank" rel="noopener">
      <span class="icon"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg></span>
      <span class="label">موقع الجملة</span><span class="arrow">‹</span>
    </a>
    <a class="link" href="https://draljamal.com/" target="_blank" rel="noopener">
      <span class="icon"><svg viewBox="0 0 24 24"><path d="M6 7V5a6 6 0 0 1 12 0v2"/><rect x="3" y="7" width="18" height="16" rx="3"/></svg></span>
      <span class="label">موقع القطاعي</span><span class="arrow">‹</span>
    </a>
    <a class="link" href="https://maps.app.goo.gl/qncRzupfBe2k1RbU8?g_st=ic" target="_blank" rel="noopener">
      <span class="icon"><svg viewBox="0 0 24 24"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg></span>
      <span class="label">موقع المحل على خرائط Google</span><span class="arrow">‹</span>
    </a>
  </section>
  <p class="social-title">تابعونا على منصات التواصل الاجتماعي</p>
  <section class="socials" aria-label="منصات التواصل">
    <a class="social" href="https://www.instagram.com/sbawazirco/" target="_blank" rel="noopener"><span>◎</span>Instagram</a>
    <a class="social" href="https://www.tiktok.com/@sbawazircompany" target="_blank" rel="noopener"><span>♪</span>TikTok</a>
    <a class="social" href="https://snapchat.com/t/eSYYhjhI" target="_blank" rel="noopener"><span>👻</span>Snapchat</a>
  </section>
  <footer class="footer"><div class="footer-mark"></div>سعيد باوزير · جميع الحقوق محفوظة</footer>
</main>
</body>
</html>
